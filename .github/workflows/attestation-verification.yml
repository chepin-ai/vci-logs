name: attestation-verification

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Verification channel identifier
        required: false
        default: default

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TARGET_PRIVATE_REPO }}
          token: ${{ secrets.AI_FULL_PAT }}
          path: target
          fetch-depth: 1
          show-progress: false

      - name: Install Lean toolchain
        env:
          LEAN_VERSION: 4.20.0
        run: |
          set -eu
          python3 -m pip install --quiet zstandard
          curl -L --retry 5 --retry-all-errors -o /tmp/lean.tar.zst "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst" > /tmp/lean-download.log 2>&1
          python3 - <<'PY'
          import os, tarfile, zstandard
          os.makedirs('/tmp/lean', exist_ok=True)
          with open('/tmp/lean.tar.zst', 'rb') as fh, zstandard.ZstdDecompressor().stream_reader(fh) as reader, tarfile.open(fileobj=reader, mode='r|') as tf:
              tf.extractall('/tmp/lean', filter='tar')
          PY
          echo "/tmp/lean/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"

      - name: Prepare pinned Mathlib
        env:
          MATHLIB_VERSION: v4.20.0
        run: |
          set -eu
          git clone --depth 1 --branch "$MATHLIB_VERSION" https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4 > /tmp/mathlib-clone.log 2>&1
          cd /tmp/mathlib4
          lake exe cache get > /tmp/mathlib-cache.log 2>&1

      - name: Run attestation verification
        env:
          ARCHIVE_PATH: ${{ secrets.CICY58_ARCHIVE_PATH }}
        run: |
          set -eu
          cd "target/$ARCHIVE_PATH/verified"
          sh -x verify.sh /tmp/mathlib4 > /tmp/attestation-verification.log 2>&1 || {
            echo 'ATTESTATION_VERIFICATION_FAIL'
            exit 1
          }
          grep -q '^VERIFICATION_PASS$' /tmp/attestation-verification.log
          echo 'ATTESTATION_VERIFICATION_PASS'

      - name: Record failure privately
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AI_FULL_PAT }}
          TARGET_PRIVATE_REPO: ${{ secrets.TARGET_PRIVATE_REPO }}
        run: |
          set -eu
          gh issue create --repo "$TARGET_PRIVATE_REPO" --title "Attestation verification debug" --body-file /tmp/attestation-verification.log
          echo 'PRIVATE_DEBUG_RECORDED'
